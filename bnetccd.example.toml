# Command Center node configuration.
#
# Every field has a default, so this whole file is optional — a node with no config at
# all is a standalone gaming server on 0.0.0.0:6112. Unknown keys are a hard error
# rather than a silent no-op, so a typo tells you at startup instead of the day you
# needed the setting.

[server]
name = "Command Center"
# gaming | warnet | both
#
#   gaming  Games, realms and ladder. Chat-gateway (bot) connections limited to one per
#           IP — see the warnet note below; the cap is the same in every mode.
#
#   warnet  Chat and bots only. Game hosting is refused with SID_STARTADVEX3 status 0x02
#           so the client shows its own "game type currently unavailable" message; the
#           game list comes back empty; the realm and WarCraft III listeners do not bind;
#           channel events are hub-sequenced so contested operator changes have exactly
#           one answer network-wide. It does NOT relax the one-bot-per-IP cap: that
#           cap is the entry cost for a fleet, and paying it is the point. Only the
#           global ceiling rises.
#
#   both    Games available, limits split by connection class.
#
# A hub can narrow this but a node can never widen it.
mode = "gaming"
motd = "Welcome to Command Center."
# Realm name for WarCraft III accounts. WarCraft III logs in with SRP, so its accounts
# cannot share a password with the other games' accounts; they live in their own
# namespace and appear as `Name@<realm>` in chat, whispers and bans. Names typed in the
# WarCraft III client never include the suffix. See docs/WARCRAFT3.md.
realm = "bncc"
# WarCraft III logon method: "nls" (SRP, the modern default) or "legacy". "legacy" advertises
# logon type 0 with no RSA signature so a StarCraft-hash loader can log in over the X-SHA-1
# path (into the plain, non-@realm namespace); "nls" is what a normal client uses. See
# docs/WARCRAFT3.md §3.7. Leave "nls" unless you run such a loader.
wc3_logon = "nls"

[listen]
# BNCS and the chat gateway share this port; they are told apart by the first byte a
# client sends (0x01 game, 0x02 BNFTP, 0x03/0x43/0x63 chat gateway).
bncs = "0.0.0.0:6112"
# Health check + Prometheus metrics endpoint. Keep it loopback.
admin = "127.0.0.1:6115"
# Number of accept loops sharing the port (SO_REUSEPORT, Unix only; forced to 1 elsewhere).
accept_shards = 1

[status]
# Password-gated HTTPS admin panel (dashboard, settings, user management, restart). Empty
# disables it. Loopback-only unless you enable remote access from its Settings page — it can
# change the server, so keep it off the open internet.
listen = "127.0.0.1:6114"
# Read-only public status page + JSON feed (plain HTTP, no auth). Empty disables it. Safe to
# expose: shows aggregate stats only. Hook a site into <addr>/status.json (CORS is open).
public_listen = ""
# Whether the public feed lists online usernames. Off shows counts/uptime/channels/games
# only; who is online is opt-in.
public_show_users = false

[discord]
# Post server updates to a Discord channel webhook. Empty (the default) disables Discord.
# Create the webhook in Discord (Channel > Edit > Integrations > Webhooks); the URL is a
# secret and lives only here. Posts are best-effort and never block the server.
webhook_url = ""
status_interval_mins = 30   # cadence of the periodic status summary
games_window_hours = 6      # window for the "games hosted per client" figure
post_status = true          # users online, channels, live games, uptime, games/client
post_events = true          # server start / shutdown / restart
post_milestones = true      # e.g. a new peak-connections record
# Separate webhook for game announcements: when any client advertises a game, a one-line
# "host is hosting <game> (<product>)" is posted here. Empty disables it independently of
# webhook_url above, so games can go to their own channel. Also a secret.
games_webhook_url = ""

[stats_push]
# Push the public status JSON to your own website on an interval. Outbound-only, so no port
# to forward — the right model for a node behind residential NAT. Empty url = disabled. The
# body is the same JSON as the public /status.json endpoint.
url = ""                    # e.g. "https://mysite.com/bnet/ingest"
interval_secs = 60
token = ""                  # optional; sent as "Authorization: Bearer <token>" — a secret
include_users = false       # include the online-usernames list in the pushed JSON

[tracker]
# PvPGN-compatible server tracking. Two independent halves, both optional.
# Advertise this server to public trackers (UDP beacon, default port 6114) so it appears on
# their lists. Empty = don't advertise.
advertise_to = []           # e.g. ["tracker.pvpgn.org", "track.muleslow.net"]
description = ""             # shown on lists; defaults to the server name
url = ""
contact_name = ""
contact_email = ""
advertise_interval_secs = 300
# Host our own tracker: receive other servers' beacons on this UDP address, and serve a
# public server-list page + /servers.json on the HTTP address. Both empty = off.
# Port 80 needs root; bind a high port (e.g. 8080) and forward 80->8080 at your router.
host_listen = ""            # e.g. "0.0.0.0:6114"
list_listen = ""            # e.g. "0.0.0.0:8080"
prune_after_secs = 600      # drop a server that stops beaconing

[limits]
# 0 means "derive from RLIMIT_NOFILE", reserving 64 descriptors for listeners, logs and
# storage handles. The effective ceiling is logged at INFO on startup — you should never
# have to guess why connections are being refused.
#
# On Linux raise it with `ulimit -n` or systemd's LimitNOFILE=. On macOS you may also
# need kern.maxfilesperproc. For 2000+ connections you want at least 4096.
max_connections = 0

# Ceilings on what an unauthenticated peer can make us buffer.
max_frame_bytes = 8192
max_line_bytes = 1024

# Per-connection outbound queue, in frames. A full queue means the peer is not reading,
# and the connection is dropped rather than buffered without bound.
outbound_queue = 64

# Accept-to-authenticated deadline, and post-authentication idle deadline.
handshake_timeout_secs = 30
idle_timeout_secs = 1200

# Addresses exempt from per-IP ceilings. Use this for your own bot host. Global and
# per-account ceilings still apply, and so does CD-key uniqueness — you can waive the
# address cost, not the key cost.
gateway_allowlist = []

# --- Per-client-type connection limits -------------------------------------------------
#
# Each client type is limited independently, because they cost their operator different
# things. Unset fields keep their default, so changing per_ip does not reset global.

# Telnet / chat gateway. There is no CD-key step in this protocol at all, so a gateway bot
# needs an account and nothing else — the address is the only cost available to charge,
# and it is charged. One per address, in every mode. Twenty gateway bots means twenty
# addresses, and that is the point.
[limits.clients.gateway]
per_ip = 1
per_account = 1
# global = 256      # 2048 in warnet mode, 1024 in both

# BNFTP file transfer. Not a bot path; clients fetch icons.bni, tos.txt and patch MPQs.
[limits.clients.bnftp]
per_ip = 4

# Fallback for any game product without its own entry below. Deliberately loose: game
# clients already pay in CD keys, and one household, LAN café or shared NAT carries
# several legitimate players.
[limits.clients.game_default]
per_ip = 8
per_account = 2

# Game connections between accept and SID_AUTH_INFO, before the product is known. This
# only bounds a connect flood; it is widened automatically if you set a product looser.
[limits.clients.game_pending]
per_ip = 16

# Per-product overrides, keyed by the four-character product code. STAR SEXP SSHR JSTR
# DRTL DSHR W2BN D2DV D2XP WAR3 W3XP.
#
# [limits.clients.products.WAR3]
# per_ip = 2                     # WarCraft III keys are scarcer than Brood War keys
#
# [limits.clients.products.SEXP]
# per_ip = 12                    # a café full of Brood War is fine

[federation]
# A standalone node is a valid deployment. Leave this false until you have a hub.
enabled = false
hub = ""
identity_key = "node.key"

# Allow logins from cached credentials while the hub is unreachable.
#
# This is a deliberate trade, not a convenience toggle. For WarCraft III (SRP) it costs
# nothing: this node holds only a verifier, which cannot be used to impersonate a user
# anywhere. For StarCraft, Diablo and Warcraft II it requires the hub to push a
# password-equivalent hash here, which means this node's operator would hold credentials
# usable on every other node in the federation.
#
# Sessions established during a partition are flagged unverified and their game results
# are quarantined until the hub reconciles, so ladder integrity is never traded for
# availability.
offline_login = false

[storage]
# Path to the SQLite database file. Leave empty and accounts live in memory only —
# fine for a quick local test, but every registration is lost on restart. Set this
# for anything that isn't a throwaway.
path = "bnetccd.db"

[files]
# Directory of operator-supplied files served over BNFTP: the version-check MPQs that
# real classic clients (Diablo I, War2 BNE, old PowerPC Mac clients) need to pass
# CheckRevision, plus icons.bni, tos.txt and ad images. The server advertises the
# platform-matched name — IX86ver1.mpq / PMACver1.mpq / XMACver1.mpq — so supply the
# platforms you want to admit. A stock PvPGN files/ directory has all of them. Empty
# disables BNFTP serving (real classic clients then hang at "Checking versions").
dir = ""

[diablo2]
# The Diablo II closed realm: the client's "Battle.net" button, with characters stored in this
# server's database. It shares the BNCS port (no extra port to forward). Creating a game needs
# a Diablo II game server, which is not built in yet — the lobby answers "Server Down". Never
# offered in warnet mode. The realm's name is server.realm. See docs/DIABLO2.md.
realm = true
description = "Diablo II closed realm"
# Host or IPv4 address clients dial for the realm. LAN clients always get the LAN address they
# connected to; set this to your public address/hostname for players on the internet.
address = ""
max_characters = 18         # per account, 1..=18
# Your Diablo II 1.14d install folder. Game.exe is read from it at startup (nothing is copied).
data_dir = ""
# EXPERIMENTAL test, off by default: let clients create and join games against the game-server
# handshake test on TCP port 4000 (forward it for internet players). A joining client gets
# Blizzard's join sequence and stops at the loading screen — there is no world yet. Needs
# data_dir. Every game packet is logged. See docs/D2GS-114D-WIRE.md.
game_server_probe = false

[admins]
# Accounts treated as Battle.net Administrators (sysops). They carry the admin flag and
# the Blizzard-representative tag (the staff icon) in every channel. Case-insensitive.
accounts = []

[channels]
# Grant operator to the first arrival of a *private* (user-created) channel. Op/Clan
# channels always auto-op and "Public *" channels never do — this governs only private
# channels. Off by default.
auto_op_private = false
# Global telnet/chat-gateway channel access: "public" (public channels only — default),
# "none", or "all". Per-channel `telnet` below overrides this.
telnet_access = "public"
# Per-category user caps (0 = unlimited).
private_max = 0
public_max = 0
clan_max = 0

# Per-product default channel: a client that joins WITHOUT naming a channel lands here.
# A client that names a channel is honoured as-is. Keyed by product FourCC.
[channels.default_channel]
STAR = "StarCraft"
SEXP = "Brood War"
W2BN = "War2 BNE"
DRTL = "Diablo"

# Pre-defined channels. Each is an [[channels.defined]] block. `products` restricts entry
# to those game clients (empty/unset = any); `min_flag` gates on a chat flag; `max_users`
# overrides the category cap.
# [[channels.defined]]
# name = "War2 BNE"
# products = ["W2BN"]      # only Warcraft II BNE clients may join
# max_users = 100
# persist = true
# [[channels.defined]]
# name = "Staff"
# min_flag = "admin"       # admin | speaker | operator
# listed = false

# [versions]
# Restrict which client version bytes may connect. Off by default (any version is
# allowed) so nobody is locked out while you learn what your community runs — every
# connection's product, platform and version byte are logged regardless. Turn it on and
# list the allowed version bytes per product and platform:
# restrict = true
# [versions.allowed.SEXP]
# IX86 = [211]        # Brood War 1.16.1 reports version byte 211 (0xD3)
# [versions.allowed.W2BN]
# IX86 = [79]         # War2 BNE reports 79 (0x4F)
