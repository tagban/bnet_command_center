# Command Center node configuration.
#
# Every field has a default, so this whole file is optional — a node with no config at
# all is a standalone gaming server on 0.0.0.0:6112. Unknown keys are a hard error
# rather than a silent no-op, so a typo tells you at startup instead of the day you
# needed the setting.

[server]
name = "Command Center"
# gaming | warnet | both
#
#   gaming  Games, realms and ladder. Chat-gateway (bot) connections limited to one per
#           IP — see the warnet note below; the cap is the same in every mode.
#
#   warnet  Chat and bots only. Game hosting is refused with SID_STARTADVEX3 status 0x02
#           so the client shows its own "game type currently unavailable" message; the
#           game list comes back empty; the realm and WarCraft III listeners do not bind;
#           channel events are hub-sequenced so contested operator changes have exactly
#           one answer network-wide. It does NOT relax the one-bot-per-IP cap: that
#           cap is the entry cost for a fleet, and paying it is the point. Only the
#           global ceiling rises.
#
#   both    Games available, limits split by connection class.
#
# A hub can narrow this but a node can never widen it.
mode = "gaming"
motd = "Welcome to Command Center."

[listen]
# BNCS and the chat gateway share this port; they are told apart by the first byte a
# client sends (0x01 game, 0x02 BNFTP, 0x03/0x43/0x63 chat gateway).
bncs = "0.0.0.0:6112"
# Admin, health and Prometheus metrics. Keep this on loopback or behind a firewall.
admin = "127.0.0.1:6115"

[limits]
# 0 means "derive from RLIMIT_NOFILE", reserving 64 descriptors for listeners, logs and
# storage handles. The effective ceiling is logged at INFO on startup — you should never
# have to guess why connections are being refused.
#
# On Linux raise it with `ulimit -n` or systemd's LimitNOFILE=. On macOS you may also
# need kern.maxfilesperproc. For 2000+ connections you want at least 4096.
max_connections = 0

# Ceilings on what an unauthenticated peer can make us buffer.
max_frame_bytes = 8192
max_line_bytes = 1024

# Per-connection outbound queue, in frames. A full queue means the peer is not reading,
# and the connection is dropped rather than buffered without bound.
outbound_queue = 64

# Accept-to-authenticated deadline, and post-authentication idle deadline.
handshake_timeout_secs = 30
idle_timeout_secs = 1200

# Addresses exempt from per-IP ceilings. Use this for your own bot host. Global and
# per-account ceilings still apply, and so does CD-key uniqueness — you can waive the
# address cost, not the key cost.
gateway_allowlist = []

# --- Per-client-type connection limits -------------------------------------------------
#
# Each client type is limited independently, because they cost their operator different
# things. Unset fields keep their default, so changing per_ip does not reset global.

# Telnet / chat gateway. There is no CD-key step in this protocol at all, so a gateway bot
# needs an account and nothing else — the address is the only cost available to charge,
# and it is charged. One per address, in every mode. Twenty gateway bots means twenty
# addresses, and that is the point.
[limits.clients.gateway]
per_ip = 1
per_account = 1
# global = 256      # 2048 in warnet mode, 1024 in both

# BNFTP file transfer. Not a bot path; clients fetch icons.bni, tos.txt and patch MPQs.
[limits.clients.bnftp]
per_ip = 4

# Fallback for any game product without its own entry below. Deliberately loose: game
# clients already pay in CD keys, and one household, LAN café or shared NAT carries
# several legitimate players.
[limits.clients.game_default]
per_ip = 8
per_account = 2

# Game connections between accept and SID_AUTH_INFO, before the product is known. This
# only bounds a connect flood; it is widened automatically if you set a product looser.
[limits.clients.game_pending]
per_ip = 16

# Per-product overrides, keyed by the four-character product code. STAR SEXP SSHR JSTR
# DRTL DSHR W2BN D2DV D2XP WAR3 W3XP.
#
# [limits.clients.products.WAR3]
# per_ip = 2                     # WarCraft III keys are scarcer than Brood War keys
#
# [limits.clients.products.SEXP]
# per_ip = 12                    # a café full of Brood War is fine

[federation]
# A standalone node is a valid deployment. Leave this false until you have a hub.
enabled = false
hub = ""
identity_key = "node.key"

# Allow logins from cached credentials while the hub is unreachable.
#
# This is a deliberate trade, not a convenience toggle. For WarCraft III (SRP) it costs
# nothing: this node holds only a verifier, which cannot be used to impersonate a user
# anywhere. For StarCraft, Diablo and Warcraft II it requires the hub to push a
# password-equivalent hash here, which means this node's operator would hold credentials
# usable on every other node in the federation.
#
# Sessions established during a partition are flagged unverified and their game results
# are quarantined until the hub reconciles, so ladder integrity is never traded for
# availability.
offline_login = false

[storage]
# Path to the SQLite database file. Leave empty and accounts live in memory only —
# fine for a quick local test, but every registration is lost on restart. Set this
# for anything that isn't a throwaway.
path = "bnetccd.db"
