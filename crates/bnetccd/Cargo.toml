[package]
name = "bnetccd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Command Center node daemon"

[dependencies]
bnetcc-core = { path = "../bnetcc-core" }
bnetcc-crypto = { path = "../bnetcc-crypto" }
bnetcc-proto = { path = "../bnetcc-proto" }
bnetcc-storage = { path = "../bnetcc-storage" }
bnetcc-storage-sqlite = { path = "../bnetcc-storage-sqlite" }
tokio.workspace = true
socket2.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
# Comment-preserving TOML editing for the admin panel's settings editor, so writing a
# setting back does not strip the operator's hand-written config comments.
toml_edit = "0.22"
tokio-rustls.workspace = true
rustls.workspace = true
rustls-pemfile.workspace = true
rcgen.workspace = true
argon2.workspace = true
rand.workspace = true
clap.workspace = true

[lints.rust]
unsafe_code = "forbid"
