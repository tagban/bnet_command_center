<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BNET Command Center — Diablo II map</title>
<style>
  :root { color-scheme: dark; --bg:#0f1115; --card:#1a1d24; --fg:#e6e8ec; --muted:#9aa0aa; --accent:#5aa9e6; --line:#2a2e37; }
  * { box-sizing: border-box; }
  [hidden] { display:none !important; }
  html, body { height:100%; }
  body { margin:0; font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif; background:var(--bg); color:var(--fg); display:flex; flex-direction:column; }
  header { padding:12px 20px; border-bottom:1px solid var(--line); display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  header nav { margin-left:auto; }
  header nav a { color:var(--accent); text-decoration:none; font-size:13px; }
  .bar { display:flex; gap:10px 16px; align-items:center; flex-wrap:wrap; padding:10px 20px; border-bottom:1px solid var(--line); background:var(--card); }
  .bar label { color:var(--muted); font-size:12px; display:flex; align-items:center; gap:6px; }
  select, button { background:#0f1115; color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:5px 8px; font:inherit; font-size:13px; }
  button { cursor:pointer; }
  .wrap { position:relative; flex:1; min-height:320px; }
  canvas { position:absolute; inset:0; width:100%; height:100%; cursor:grab; display:block; }
  canvas.drag { cursor:grabbing; }
  .status { position:absolute; left:12px; bottom:10px; font-size:12px; color:var(--muted); background:rgba(15,17,21,.8); padding:6px 10px; border-radius:6px; pointer-events:none; }
  .legend { position:absolute; right:12px; bottom:10px; font-size:12px; background:rgba(15,17,21,.85); border:1px solid var(--line); padding:8px 10px; border-radius:6px; display:grid; grid-template-columns:auto auto; gap:2px 8px; }
  .sw { display:inline-block; width:10px; height:10px; border-radius:2px; vertical-align:middle; }
  .empty { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--muted); }
  .tip { position:absolute; pointer-events:none; background:rgba(15,17,21,.92); border:1px solid var(--line); border-radius:6px; padding:4px 8px; font-size:12px; white-space:nowrap; }
</style>
</head>
<body>
<header>
  <h1>Diablo II · Live map</h1>
  <span id="meta" style="color:var(--muted);font-size:12px"></span>
  <nav><a href="/">Dashboard</a> · <a href="/users">Users</a> · <a href="/settings">Settings</a> · <a href="/help">Help</a></nav>
</header>
<div class="bar">
  <label>Game <select id="game"></select></label>
  <label>Level <select id="level"></select></label>
  <label>Follow <select id="follow"><option value="">nobody</option></select></label>
  <label>View <select id="view"><option value="iso">Isometric</option><option value="top">Top-down</option></select></label>
  <label><input type="checkbox" id="showMonsters" checked> Monsters</label>
  <label><input type="checkbox" id="showObjects" checked> Objects</label>
  <label><input type="checkbox" id="showLabels" checked> Labels</label>
  <button id="fit">Fit level</button>
</div>
<div class="wrap" id="wrap">
  <canvas id="map"></canvas>
  <div class="empty" id="empty">No Diablo II games are running.</div>
  <div class="status" id="status"></div>
  <div class="tip" id="tip" hidden></div>
  <div class="legend">
    <span><span class="sw" style="background:#4d5a45"></span> Open ground</span><span><span class="sw" style="background:#5a4a3a"></span> Blocked, missiles pass</span>
    <span><span class="sw" style="background:#343842"></span> Blocked</span><span><span class="sw" style="background:#7a6432"></span> Players can't pass</span>
    <span style="color:#7ee081">● Player</span><span style="color:#e05a5a">● Monster</span>
    <span style="color:#e6c95a">● NPC</span><span style="color:#5ad1e6">◆ Waypoint</span>
    <span style="color:#b98ae6">◆ Shrine</span><span style="color:#f0a040">◎ Entrance</span>
  </div>
</div>
<script>
"use strict";
const $ = id => document.getElementById(id);
const canvas = $("map"), ctx = canvas.getContext("2d");
const state = { games: [], gameId: null, levelId: null, level: null, image: null, live: null, cam: null, zoom: 2, userMoved: false };

function project(wx, wy) { return $("view").value === "iso" ? [wx - wy, (wx + wy) / 2] : [wx, wy]; }

async function getJson(url) {
  const r = await fetch(url, { cache: "no-store" });
  if (r.redirected || !r.ok) throw new Error(r.status);
  return r.json();
}

function colour(v) {
  if (v === 255) return null;
  if (v & 1) return (v & 4) ? [52, 56, 66] : [90, 74, 58];
  if (v & 8) return [122, 100, 50];
  return [77, 90, 69];
}

function buildImage(level) {
  const w = level.info.w * 5, h = level.info.h * 5;
  const raw = atob(level.grid);
  const off = document.createElement("canvas");
  off.width = w; off.height = h;
  const oc = off.getContext("2d");
  const img = oc.createImageData(w, h);
  for (let i = 0; i < w * h; i++) {
    const c = colour(raw.charCodeAt(i));
    if (!c) continue;
    img.data[i * 4] = c[0]; img.data[i * 4 + 1] = c[1]; img.data[i * 4 + 2] = c[2]; img.data[i * 4 + 3] = 255;
  }
  oc.putImageData(img, 0, 0);
  return off;
}

function fit() {
  const l = state.level; if (!l) return;
  const x0 = l.info.x * 5, y0 = l.info.y * 5, x1 = x0 + l.info.w * 5, y1 = y0 + l.info.h * 5;
  const pts = [[x0, y0], [x1, y0], [x0, y1], [x1, y1]].map(p => project(p[0], p[1]));
  const minX = Math.min(...pts.map(p => p[0])), maxX = Math.max(...pts.map(p => p[0]));
  const minY = Math.min(...pts.map(p => p[1])), maxY = Math.max(...pts.map(p => p[1]));
  state.cam = [(minX + maxX) / 2, (minY + maxY) / 2];
  state.zoom = Math.min(canvas.width / (maxX - minX), canvas.height / (maxY - minY)) * 0.92;
  state.userMoved = false;
  draw();
}

function toScreen(wx, wy) {
  const [vx, vy] = project(wx, wy);
  return [(vx - state.cam[0]) * state.zoom + canvas.width / 2, (vy - state.cam[1]) * state.zoom + canvas.height / 2];
}

function draw() {
  const dpr = window.devicePixelRatio || 1;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = "#0b0d10";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  const l = state.level;
  if (!l || !state.cam) return;
  const z = state.zoom, W = canvas.width / 2, H = canvas.height / 2, [cx, cy] = state.cam;
  const iso = $("view").value === "iso";
  const a = z, b = iso ? z / 2 : 0, c = iso ? -z : 0, d = iso ? z / 2 : z;
  const e = W - z * cx, f = H - z * cy;
  const ox = l.info.x * 5, oy = l.info.y * 5;
  ctx.imageSmoothingEnabled = false;
  ctx.setTransform(a, b, c, d, e + a * ox + c * oy, f + b * ox + d * oy);
  // Rooms without a collision map (the town) show as outlines.
  ctx.strokeStyle = "rgba(154,160,170,.25)"; ctx.lineWidth = 1 / z;
  for (const r of l.rooms) ctx.strokeRect((r[0] - l.info.x) * 5, (r[1] - l.info.y) * 5, r[2] * 5, r[3] * 5);
  ctx.drawImage(state.image, 0, 0);
  ctx.setTransform(1, 0, 0, 1, 0, 0);

  const labels = $("showLabels").checked;
  const size = Math.max(3, Math.min(7, z * 1.5)) * dpr;
  ctx.font = `${12 * dpr}px -apple-system,system-ui,sans-serif`;
  ctx.textBaseline = "middle";
  const label = (text, x, y, colour) => { if (!labels) return; ctx.fillStyle = "rgba(0,0,0,.7)"; ctx.fillText(text, x + size + 3 * dpr + 1, y + 1); ctx.fillStyle = colour; ctx.fillText(text, x + size + 3 * dpr, y); };
  const dot = (x, y, r, colour) => { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fillStyle = colour; ctx.fill(); };
  const diamond = (x, y, r, colour) => { ctx.beginPath(); ctx.moveTo(x, y - r); ctx.lineTo(x + r, y); ctx.lineTo(x, y + r); ctx.lineTo(x - r, y); ctx.closePath(); ctx.fillStyle = colour; ctx.fill(); };
  state.hits = [];
  for (const m of l.entrances) {
    const [x, y] = toScreen(m.x, m.y);
    ctx.beginPath(); ctx.arc(x, y, size * 1.8, 0, Math.PI * 2); ctx.strokeStyle = "#f0a040"; ctx.lineWidth = 2 * dpr; ctx.stroke();
    dot(x, y, size * 0.6, "#f0a040"); label(m.name, x + size, y, "#f0c080");
    state.hits.push([x, y, m.name]);
  }
  if ($("showObjects").checked) {
    for (const m of l.marks) {
      const [x, y] = toScreen(m.x, m.y);
      if (m.kind === "waypoint") { diamond(x, y, size * 1.4, "#5ad1e6"); label("Waypoint", x, y, "#9ae6f2"); }
      else if (m.kind === "shrine") { diamond(x, y, size, "#b98ae6"); }
      else if (m.kind === "npc") continue;
      else { ctx.fillStyle = "#8a8f99"; ctx.fillRect(x - size / 2, y - size / 2, size, size); }
      state.hits.push([x, y, m.name]);
    }
  }
  const live = state.live;
  if (live) {
    for (const u of live.units) {
      if (u.kind === "object") continue;
      if (u.kind === "monster" && !$("showMonsters").checked) continue;
      const [x, y] = toScreen(u.x, u.y);
      dot(x, y, size * (u.kind === "npc" ? 0.8 : 0.6), u.kind === "npc" ? "#e6c95a" : "#e05a5a");
      if (u.kind === "npc") label(u.name, x, y, "#e6d9a0");
      state.hits.push([x, y, u.name]);
    }
    for (const p of live.players) {
      if (p.level !== state.levelId) continue;
      const [x, y] = toScreen(p.x, p.y);
      dot(x, y, size * 1.3, "#ffffff"); dot(x, y, size, "#7ee081");
      label(p.name, x + size * 0.5, y, "#bff5c0");
      state.hits.push([x, y, `${p.name} (${p.x}, ${p.y})`]);
    }
    const monsters = live.units.filter(u => u.kind === "monster").length;
    $("status").textContent = `${l.info.name} · rooms populated ${live.populated_rooms}/${live.rooms} · ${monsters} monsters · ${new Date().toLocaleTimeString()}`;
  }
}

function resize() {
  const dpr = window.devicePixelRatio || 1;
  const rect = $("wrap").getBoundingClientRect();
  canvas.width = Math.max(1, Math.round(rect.width * dpr));
  canvas.height = Math.max(1, Math.round(rect.height * dpr));
  if (state.level && !state.userMoved) fit(); else draw();
}

function fillSelect(sel, items, current) {
  const html = items.map(([v, t]) => `<option value="${v}">${t.replace(/&/g, "&amp;").replace(/</g, "&lt;")}</option>`).join("");
  if (sel.dataset.html !== html) { sel.innerHTML = html; sel.dataset.html = html; }
  if (current !== null && [...sel.options].some(o => o.value === String(current))) sel.value = String(current);
}

async function refreshGames() {
  let games;
  try { games = await getJson("/d2/games.json"); } catch (e) { $("meta").textContent = "Signed out? Reload the page."; return; }
  state.games = games;
  $("empty").hidden = games.length > 0;
  $("meta").textContent = games.length ? `${games.length} game${games.length === 1 ? "" : "s"} running` : "";
  if (!games.length) { state.gameId = null; state.level = null; draw(); return; }
  if (!games.some(g => g.id === state.gameId)) state.gameId = games[0].id;
  fillSelect($("game"), games.map(g => [g.id, `${g.name} · ${["Normal", "Nightmare", "Hell"][g.difficulty] || "?"} · ${g.players.length} player${g.players.length === 1 ? "" : "s"}`]), state.gameId);
  const game = games.find(g => g.id === state.gameId);
  const follow = $("follow").value;
  fillSelect($("follow"), [["", "nobody"], ...game.players.map(p => [p.name, p.name])], follow);
  fillSelect($("level"), game.levels.map(l => [l.id, `${l.name} (${l.id})`]), state.levelId);
  const followed = game.players.find(p => p.name === $("follow").value);
  let wanted = state.levelId;
  if (followed && followed.level != null) wanted = followed.level;
  if (wanted === null || !game.levels.some(l => l.id === wanted)) {
    const someone = game.players.find(p => p.level != null);
    wanted = someone ? someone.level : game.levels[0].id;
  }
  if (wanted !== state.levelId || !state.level) await loadLevel(wanted);
}

async function loadLevel(levelId) {
  state.levelId = levelId;
  $("level").value = String(levelId);
  try {
    state.level = await getJson(`/d2/level.json?game=${state.gameId}&level=${levelId}`);
  } catch (e) { state.level = null; return; }
  state.image = buildImage(state.level);
  state.live = null;
  fit();
  refreshLive();
}

async function refreshLive() {
  if (state.gameId === null || state.levelId === null) return;
  try { state.live = await getJson(`/d2/live.json?game=${state.gameId}&level=${state.levelId}`); } catch (e) { return; }
  const followed = state.live.players.find(p => p.name === $("follow").value);
  if (followed) {
    if (followed.level !== state.levelId && followed.level != null) { loadLevel(followed.level); return; }
    state.cam = project(followed.x, followed.y);
    if (!state.userMoved) state.zoom = Math.max(state.zoom, 3);
  }
  draw();
}

$("game").onchange = () => { state.gameId = Number($("game").value); state.levelId = null; state.level = null; refreshGames(); };
$("level").onchange = () => { $("follow").value = ""; loadLevel(Number($("level").value)); };
$("follow").onchange = () => { state.userMoved = false; refreshLive(); };
$("view").onchange = () => fit();
for (const id of ["showMonsters", "showObjects", "showLabels"]) $(id).onchange = draw;
$("fit").onclick = () => { $("follow").value = ""; fit(); };

let drag = null;
canvas.addEventListener("mousedown", e => { drag = [e.clientX, e.clientY]; canvas.classList.add("drag"); });
window.addEventListener("mouseup", () => { drag = null; canvas.classList.remove("drag"); });
window.addEventListener("mousemove", e => {
  const dpr = window.devicePixelRatio || 1;
  if (drag && state.cam) {
    state.cam[0] -= (e.clientX - drag[0]) * dpr / state.zoom;
    state.cam[1] -= (e.clientY - drag[1]) * dpr / state.zoom;
    drag = [e.clientX, e.clientY];
    state.userMoved = true; $("follow").value = "";
    draw();
    return;
  }
  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) * dpr, my = (e.clientY - rect.top) * dpr;
  const tip = $("tip");
  const hit = (state.hits || []).find(h => Math.hypot(h[0] - mx, h[1] - my) < 8 * dpr);
  if (hit && e.target === canvas) { tip.textContent = hit[2]; tip.style.left = `${e.clientX - rect.left + 12}px`; tip.style.top = `${e.clientY - rect.top + 12}px`; tip.hidden = false; }
  else tip.hidden = true;
});
canvas.addEventListener("wheel", e => {
  e.preventDefault();
  if (!state.cam) return;
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) * dpr - canvas.width / 2, my = (e.clientY - rect.top) * dpr - canvas.height / 2;
  const before = [state.cam[0] + mx / state.zoom, state.cam[1] + my / state.zoom];
  state.zoom = Math.min(40, Math.max(0.2, state.zoom * (e.deltaY < 0 ? 1.2 : 1 / 1.2)));
  state.cam = [before[0] - mx / state.zoom, before[1] - my / state.zoom];
  state.userMoved = true;
  draw();
}, { passive: false });

window.addEventListener("resize", resize);
resize();
refreshGames();
setInterval(refreshGames, 3000);
setInterval(refreshLive, 800);
</script>
</body>
</html>
