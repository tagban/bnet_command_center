[package]
name = "bnetcc-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Command Center persistence: Storage trait, attribute ACLs, write-behind, in-memory backend"

# Zero dependencies. The trait, the ACL model, the write-behind layer and the conformance
# suite are all pure logic, so they build and test anywhere. Concrete database backends
# live in their own crates (see bnetcc-storage-sqlite) and are the only place a driver
# dependency appears.
[dependencies]
bnetcc-core = { path = "../bnetcc-core" }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
