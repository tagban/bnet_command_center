[workspace]
resolver = "2"
members = [
    "crates/bnetcc-crypto",
    "crates/bnetcc-proto",
    "crates/bnetcc-core",
    "crates/bnetcc-storage",
    "crates/smoke",
    "crates/bnetccd",
    "crates/bnetcc-storage-sqlite",
    "crates/bnetcc-launcher",
    "crates/d2-formats",
    "crates/d2-data",
    "crates/d2-drlg",
    "crates/d2-game",
    "crates/winbot",
    "crates/pvpgn-import",
    "crates/bnetcc-federation",
    "crates/bnetcc-icons",
]

[workspace.package]
version = "0.2.3"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/tagban/bnet_command_center"

[workspace.dependencies]
bytes = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
socket2 = { version = "0.5", features = ["all"] }
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio-rustls = "0.26"
rustls = "0.23"
rustls-pemfile = "2"
rcgen = "0.13"
argon2 = "0.5"
rand = "0.8"
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

# A panic in one connection task must not take the process down. We use
# panic = "abort" in release so that a panic is a loud crash in testing,
# and every connection task is additionally wrapped so a bug in one
# session cannot poison shared state. See ARCHITECTURE.md section 3.
